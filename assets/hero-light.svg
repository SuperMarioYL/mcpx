<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="mcpx — 一条命令把 MCP server 装进你所有的客户端">
  <defs>
    <linearGradient id="hg-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <marker id="hah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>

  <!-- wordmark -->
  <text x="60" y="118" font-size="76" font-weight="700" letter-spacing="-2" fill="url(#hg-l)">mcpx</text>
  <text x="63" y="158" font-size="19" font-weight="600" fill="#1D1D1F">一条命令，把 MCP server 装进你所有的客户端</text>
  <text x="63" y="184" font-size="14" font-weight="500" fill="#6E6E73">探测客户端 · 备份先行 · 幂等写入 · 握手验证 · 无账号 · 无云</text>

  <!-- pill: no account / no cloud -->
  <g transform="translate(60,206)">
    <rect x="0" y="0" width="118" height="26" rx="13" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1"/>
    <text x="59" y="17" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4F9E">no account</text>
    <rect x="130" y="0" width="92" height="26" rx="13" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1"/>
    <text x="176" y="17" text-anchor="middle" font-size="12" font-weight="600" fill="#4B3FC4">no cloud</text>
    <rect x="234" y="0" width="120" height="26" rx="13" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1"/>
    <text x="294" y="17" text-anchor="middle" font-size="12" font-weight="600" fill="#0B6B53">single binary</text>
  </g>

  <!-- right-side terminal glyph: one command → three green clients -->
  <g transform="translate(560,58)">
    <rect x="0" y="0" width="270" height="184" rx="16" fill="#FFFFFF" stroke="#C9C9D0" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="4.5" fill="#FF5F57"/>
    <circle cx="36" cy="20" r="4.5" fill="#FEBC2E"/>
    <circle cx="52" cy="20" r="4.5" fill="#28C840"/>
    <text x="20" y="58" font-size="13" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#6E6E73">$</text>
    <text x="34" y="58" font-size="13" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-weight="600" fill="#1D1D1F">mcpx add filesystem</text>
    <line x1="20" y1="76" x2="250" y2="76" stroke="#E4E4E8" stroke-width="1"/>
    <g font-size="12.5" font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text x="20" y="100" fill="#10A37F">✓</text><text x="40" y="100" fill="#1D1D1F">Claude Code</text><text x="230" y="100" text-anchor="end" fill="#10A37F">OK</text>
      <text x="20" y="124" fill="#10A37F">✓</text><text x="40" y="124" fill="#1D1D1F">Claude Desktop</text><text x="230" y="124" text-anchor="end" fill="#10A37F">OK</text>
      <text x="20" y="148" fill="#10A37F">✓</text><text x="40" y="148" fill="#1D1D1F">Codex</text><text x="230" y="148" text-anchor="end" fill="#10A37F">OK</text>
    </g>
    <text x="20" y="172" font-size="12.5" font-weight="700" font-family="'SFMono-Regular',Menlo,Consolas,monospace" fill="#10A37F">✓ 3/3 clients ready</text>
  </g>
</svg>
